name: PC Backup Vault Tiefen-TÜV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tuev/deep-consolidation-drive-discovery-1.9.24
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'schema.sql'
      - 'schema_core_jobs.sql'
      - 'installer/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  regression:
    name: Gesamtregression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Paketabhängigkeiten prüfen
        run: python -m pip check

      - name: Gesamten Python-Stand kompilieren
        run: python -m compileall -q .

      - name: Project-Finder-Regression
        run: python -m unittest discover -s project_finder/tests -p 'test_*.py' -v

      - name: Vollständige Root-Regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Integrations-/Patchkette importieren
        run: python -c "import app; print('app.py Import/Patchkette PASS')"

      - name: Windows-Laufwerksinventar real prüfen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import os
          from windows_drive_inventory_v1924 import drive_inventory, normalize_drive_root
          rows = drive_inventory()
          for row in rows:
              print(row['display'], '->', row['root'])
          if not rows:
              raise SystemExit('Kein Windows-Laufwerk erkannt')
          system_drive = normalize_drive_root(os.environ.get('SystemDrive') or 'C:')
          roots = {str(row['root']).casefold() for row in rows}
          if system_drive.casefold() not in roots:
              raise SystemExit(f'Systemlaufwerk fehlt: {system_drive}')
          print(f'Windows-Laufwerksinventar PASS: {len(rows)} Laufwerk(e)')
          '@ | python -

      - name: Version, Installer und Releasepfad konsolidieren
        shell: python
        run: |
          import re
          from pathlib import Path
          from config_store import APP_VERSION
          iss = Path('installer/PC_Backup_Vault.iss').read_text(encoding='utf-8')
          wf = Path('.github/workflows/release-windows.yml').read_text(encoding='utf-8')
          match = re.search(r'#define MyAppVersion "([^"]+)"', iss)
          if not match or match.group(1) != APP_VERSION:
              raise SystemExit('Installer- und Programmversion sind nicht identisch.')
          required = ['Setup.exe.sha256', 'Vollständige Regression', 'unittest discover', 'pyinstaller']
          missing = [item for item in required if item not in wf]
          if missing:
              raise SystemExit('Release-Sicherheitsgate fehlt: ' + ', '.join(missing))
          print('Version/Release-Pfad konsistent:', APP_VERSION)

      - name: Updater-Sicherheitsmerkmale prüfen
        shell: python
        run: |
          from pathlib import Path
          updater = Path('auto_updater.py').read_text(encoding='utf-8')
          ui = Path('update_ui.py').read_text(encoding='utf-8')
          required_updater = ['sha256', '.part', 'releases/latest', 'Setup.exe', 'is_newer_version']
          required_ui = ['Progressbar', '_backup_running', 'Später', 'Update herunterladen und installieren']
          missing = [x for x in required_updater if x not in updater] + [x for x in required_ui if x not in ui]
          if missing:
              raise SystemExit('Updater-TÜV fehlt: ' + ', '.join(missing))
          print('Updater-TÜV: Sicherheitsmerkmale vorhanden.')

      - name: Geschützte Kernmodule gegen main prüfen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          protected=(backup_engine.py object_store.py crypto_box.py vault_db.py verification.py recovery_pass.py hidrive_sftp_v192.py)
          changed="$(git diff --name-only origin/main...HEAD -- "${protected[@]}")"
          if [ -n "$changed" ]; then
            echo 'Unerwartete Änderungen an geschützten Backup-/Krypto-/Restore-Kernmodulen:'
            echo "$changed"
            exit 1
          fi
          echo 'Geschützte Backup-/Krypto-/Restore-Kernmodule unverändert.'

      - name: TÜV-Zusammenfassung
        if: always()
        shell: bash
        run: |
          echo '## PC Backup Vault Tiefen-TÜV' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Plattform: ${{ matrix.os }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gesamter Python-Stand kompiliert' >> "$GITHUB_STEP_SUMMARY"
          echo '- Project-Finder- und vollständige Root-Regression ausgeführt' >> "$GITHUB_STEP_SUMMARY"
          echo '- app.py/Patchkette importiert' >> "$GITHUB_STEP_SUMMARY"
          echo '- Version/Installer/Release-Sicherheitsgates geprüft' >> "$GITHUB_STEP_SUMMARY"
          echo '- Updater-Sicherheitsmerkmale geprüft' >> "$GITHUB_STEP_SUMMARY"
          echo '- Windows-Laufwerksinventar wird auf Windows real gegen das Systemlaufwerk geprüft' >> "$GITHUB_STEP_SUMMARY"
