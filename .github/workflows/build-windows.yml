name: Windows EXE und Setup bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - hotfix/source-selection-safety-1.9.22
      - hotfix/backup-target-selection-1.9.21
      - feature/exact-storage-explorer-1.9.20
      - feature/storage-center-ui-1.9.19
      - fix/hidrive-account-list-1.9.18
      - feature/context-progress-1.9.17
      - feature/hidrive-hidden-items-1.9.16
      - feature/hidrive-tree-explorer-1.9.15
      - feature/hidrive-live-explorer-1.9.14
      - hotfix/hidrive-tuev-explorer-1.9.13
      - fix/hidrive-target-activation-v192
      - feature/1.9.3-unified-reporting
      - feature/1.9.4-backup-workbench
      - fix/1.9.5-backup-entry-updater
      - feature/1.9.6-workbench-ui-polish
      - fix/1.9.7-workbench-close
      - feature/1.9.8-job-archive-restore
      - feature/1.9.9-job-archive-pro
      - feature/1.9.9-restore-progress
    paths:
      - "**.py"
      - "requirements.txt"
      - "schema.sql"
      - "schema_core_jobs.sql"
      - "BUILD_EXE.bat"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Version konsolidieren
        id: version
        shell: pwsh
        run: |
          $cfg = Get-Content config_store.py -Raw
          $iss = Get-Content installer/PC_Backup_Vault.iss -Raw
          $m = [regex]::Match($cfg, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "APP_VERSION konnte nicht gelesen werden." }
          $version = $m.Groups[1].Value
          if ($iss -notmatch ('MyAppVersion "' + [regex]::Escape($version) + '"')) { throw "Installer- und Programmversion sind nicht identisch." }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "APP_VERSION $version"
      - name: Integrierten Quellstand kompilieren
        shell: pwsh
        run: python -m compileall -q .
      - name: Professionelle Regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_professional_v180
          python -m unittest -v tests.test_bridge_system_image_v180
          python -m unittest -v tests.test_scheduler_release_v183
          python -m unittest -v tests.test_restore_path_fix_v188
          python -m unittest -v tests.test_inventory_backup_handoff_v190
          python -m unittest -v tests.test_storage_health_production_patch
          python -m unittest -v tests.test_hidrive_sftp_v192
          python -m unittest -v tests.test_hidrive_tuev_fix_v1913
          python -m unittest -v tests.test_hidrive_live_explorer_v1914
          python -m unittest -v tests.test_hidrive_live_safety_v1914
          python -m unittest -v tests.test_hidrive_tree_explorer_v1915
          python -m unittest -v tests.test_hidrive_tree_selection_safety_v1915
          python -m unittest -v tests.test_hidrive_hidden_items_v1916
          python -m unittest -v tests.test_context_progress_v1917
          python -m unittest -v tests.test_hidrive_account_list_fix_v1918
          python -m unittest -v tests.test_storage_center_v1919
          python -m unittest -v tests.test_storage_center_exact_v1920
          python -m unittest -v tests.test_main_navigation_v1919
          python -m unittest -v tests.test_test_runtime_fix_v1919
          python -m unittest -v tests.test_dual_hidrive_config_v191
          python -m unittest -v tests.test_cloud_target_activation_v192
          python -m unittest -v tests.test_unified_reporting_v193
          python -m unittest -v tests.test_backup_workbench_v194
          python -m unittest -v tests.test_hotfix_v195
          python -m unittest -v tests.test_backup_workbench_ui_v196
          python -m unittest -v tests.test_backup_target_selection_fix_v1921
          python -m unittest -v tests.test_backup_source_selection_safety_v1922
          python -m unittest -v tests.test_job_archive_v198
          python -m unittest -v tests.test_job_archive_safe_v199
          python -m unittest -v tests.test_restore_progress_v1910
          python -m unittest -v tests.test_restore_explorer_v1911
          python -m unittest -v tests.test_windows_volume_labels_v1912
      - name: PC Backup Vault bauen
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name "PC_Backup_Vault" --hidden-import "matplotlib.backends.backend_tkagg" --collect-all boto3 --collect-all botocore --collect-all qrcode --collect-all paramiko --add-data "schema.sql;." --add-data "schema_core_jobs.sql;." app.py
      - name: Portables Windows-Paket erstellen
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist/PC_Backup_Vault/*" -DestinationPath "PC_Backup_Vault_${version}_Windows_Portable.zip" -Force
      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Windows Setup bauen
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC_Backup_Vault.iss"
          $setup = "installer\output\PC_Backup_Vault_${version}_Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup EXE wurde nicht erzeugt: $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  PC_Backup_Vault_${version}_Setup.exe" | Set-Content -Encoding ascii ($setup + ".sha256")
      - name: Windows Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC_Backup_Vault_${{ steps.version.outputs.version }}_Setup
          path: |
            installer/output/PC_Backup_Vault_${{ steps.version.outputs.version }}_Setup.exe
            installer/output/PC_Backup_Vault_${{ steps.version.outputs.version }}_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Portable Version bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC_Backup_Vault_${{ steps.version.outputs.version }}_Windows_Portable
          path: PC_Backup_Vault_${{ steps.version.outputs.version }}_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Release für Update-Funktion veröffentlichen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag ist bereits veröffentlicht; Release bleibt unverändert."; exit 0 }
          gh release create $tag `
            "installer/output/PC_Backup_Vault_${version}_Setup.exe" `
            "installer/output/PC_Backup_Vault_${version}_Setup.exe.sha256" `
            "PC_Backup_Vault_${version}_Windows_Portable.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PC Backup Vault v$version" `
            --notes "1.9.22: Die Quellenauswahl verhindert unbeabsichtigte Vollordner-Backups. Datei und übergeordneter Ordner können nicht mehr unbemerkt gleichzeitig ausgewählt bleiben. Eine präzisere Datei-/Unterordnerauswahl ersetzt einen zuvor gewählten übergeordneten Ordner; ein nachträglich gewählter breiter Ordner wird blockiert, solange darunter Einzelquellen ausgewählt sind. Die Quellenliste kennzeichnet DATEI und ORDNER sichtbar und der Backup-Start blockiert verbleibende Überlappungen."