name: Windows EXE und Setup bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/project-finder-productive-inventory
    paths:
      - "**.py"
      - "requirements.txt"
      - "schema.sql"
      - "schema_core_jobs.sql"
      - "BUILD_EXE.bat"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Versionskonsistenz prüfen
        shell: pwsh
        run: |
          python -c "from config_store import APP_VERSION; assert APP_VERSION == '1.8.6', APP_VERSION; print('APP_VERSION', APP_VERSION)"

      - name: Integrierten Quellstand kompilieren
        shell: pwsh
        run: python -m compileall -q .

      - name: Professionelle 1.8 Regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_professional_v180
          python -m unittest -v tests.test_bridge_system_image_v180
          python -m unittest -v tests.test_scheduler_release_v183

      - name: PC Backup Vault bauen
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "PC_Backup_Vault" --hidden-import "matplotlib.backends.backend_tkagg" --collect-all boto3 --collect-all botocore --collect-all qrcode --add-data "schema.sql;." --add-data "schema_core_jobs.sql;." app.py

      - name: Portables Windows-Paket erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PC_Backup_Vault/*" -DestinationPath "PC_Backup_Vault_1.8.6_Windows_Portable.zip" -Force

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Windows Setup bauen
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC_Backup_Vault.iss"
          if (-not (Test-Path "installer\output\PC_Backup_Vault_1.8.6_Setup.exe")) { throw "Setup EXE wurde nicht erzeugt" }
          $hash = (Get-FileHash "installer\output\PC_Backup_Vault_1.8.6_Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  PC_Backup_Vault_1.8.6_Setup.exe" | Set-Content -Encoding ascii "installer\output\PC_Backup_Vault_1.8.6_Setup.exe.sha256"

      - name: Windows Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC_Backup_Vault_1.8.6_Setup
          path: |
            installer/output/PC_Backup_Vault_1.8.6_Setup.exe
            installer/output/PC_Backup_Vault_1.8.6_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Portable Version bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC_Backup_Vault_1.8.6_Windows_Portable
          path: PC_Backup_Vault_1.8.6_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release v1.8.6 für Update-Funktion veröffentlichen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.8.6"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag ist bereits veröffentlicht; Release bleibt unverändert."
            exit 0
          }
          gh release create $tag `
            "installer/output/PC_Backup_Vault_1.8.6_Setup.exe" `
            "installer/output/PC_Backup_Vault_1.8.6_Setup.exe.sha256" `
            "PC_Backup_Vault_1.8.6_Windows_Portable.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PC Backup Vault v1.8.6" `
            --notes "1.8.6: neuer einfacher Wiederherstellungs-Assistent mit direktem Wiederherstellen-Button; klare Schritte für Datei, Sicherungsstand, Ziel und sichere Konfliktbehandlung. Der Backup-Explorer bleibt als Expertenansicht erhalten."
