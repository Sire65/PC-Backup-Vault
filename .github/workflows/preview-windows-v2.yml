name: Windows Backup Central Preview

on:
  push:
    branches:
      - feature/kc-backup-central-security-foundation
    paths:
      - '.github/workflows/preview-windows-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build preview executable
        shell: pwsh
        run: |
          if (Test-Path 'PC_Backup_Vault.spec') {
            pyinstaller --noconfirm --clean PC_Backup_Vault.spec
          } elseif (Test-Path 'pc_backup_vault.spec') {
            pyinstaller --noconfirm --clean pc_backup_vault.spec
          } else {
            pyinstaller --noconfirm --clean --windowed --name PC_Backup_Vault_PREVIEW app.py
          }
      - name: Package preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview | Out-Null
          Copy-Item -Path dist\* -Destination preview -Recurse -Force
          Set-Content -Path preview\PREVIEW_BUILD.txt -Value "PREVIEW ONLY - commit $env:GITHUB_SHA - not an official release"
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Backup-Vault-Backup-Central-PREVIEW
          path: preview/
          if-no-files-found: error
          retention-days: 7
