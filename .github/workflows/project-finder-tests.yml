name: Project Finder Regression

on:
  push:
    branches:
      - feature/project-finder-safe-cleanup
    paths:
      - 'project_finder/**'
      - 'tests/test_project_finder_cloud_contract.py'
      - '.github/workflows/project-finder-tests.yml'
  pull_request:
    paths:
      - 'project_finder/**'
      - 'tests/test_project_finder_cloud_contract.py'
      - '.github/workflows/project-finder-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Project Finder
        run: python -m compileall -q project_finder
      - name: Run Project Finder unit tests
        run: python -m unittest discover -s project_finder/tests -p 'test_*.py' -v
      - name: Run cloud contract regression
        run: |
          if [ -f tests/test_project_finder_cloud_contract.py ]; then
            python -m unittest tests.test_project_finder_cloud_contract -v
          else
            echo 'Cloud contract regression file not present; skipped.'
          fi
