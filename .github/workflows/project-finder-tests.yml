name: Project Finder Regression

# Final regression gate for the repaired inventory/Git handoff branch.
on:
  push:
    branches:
      - feature/project-finder-safe-cleanup
      - feature/project-finder-productive-inventory
      - feature/kc-backup-central-security-foundation
    paths:
      - 'project_finder/**'
      - 'app.py'
      - 'ui.py'
      - 'backup_engine.py'
      - 'object_store.py'
      - 'auto_updater.py'
      - 'update_ui.py'
      - 'config_store.py'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/project-finder-tests.yml'
  pull_request:
    paths:
      - 'project_finder/**'
      - 'app.py'
      - 'ui.py'
      - 'backup_engine.py'
      - 'object_store.py'
      - 'auto_updater.py'
      - 'update_ui.py'
      - 'config_store.py'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/project-finder-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile full Python source tree
        run: |
          python -m compileall -q .
      - name: Run Project Finder unit tests
        run: python -m unittest discover -s project_finder/tests -p 'test_*.py' -v
      - name: Run complete root regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify version consistency
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from config_store import APP_VERSION
          iss = Path('installer/PC_Backup_Vault.iss').read_text(encoding='utf-8')
          match = re.search(r'#define MyAppVersion "([^"]+)"', iss)
          if not match or match.group(1) != APP_VERSION:
              raise SystemExit(f'Versionskonflikt: config={APP_VERSION!r}, installer={match.group(1) if match else None!r}')
          print('Version konsistent:', APP_VERSION)
          PY