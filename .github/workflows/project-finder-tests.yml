name: Project Finder Regression

on:
  push:
    branches:
      - feature/project-finder-safe-cleanup
      - feature/project-finder-productive-inventory
    paths:
      - 'project_finder/**'
      - 'app.py'
      - 'ui.py'
      - 'backup_engine.py'
      - 'object_store.py'
      - 'auto_updater.py'
      - 'update_ui.py'
      - 'config_store.py'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/project-finder-tests.yml'
  pull_request:
    paths:
      - 'project_finder/**'
      - 'app.py'
      - 'ui.py'
      - 'backup_engine.py'
      - 'object_store.py'
      - 'auto_updater.py'
      - 'update_ui.py'
      - 'config_store.py'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/project-finder-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile full Python source tree
        run: |
          python -m compileall -q .
      - name: Run Project Finder unit tests
        run: python -m unittest discover -s project_finder/tests -p 'test_*.py' -v
      - name: Run complete root regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify version consistency
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from config_store import APP_VERSION
          iss = Path('installer/PC_Backup_Vault.iss').read_text(encoding='utf-8')
          match = re.search(r'#define MyAppVersion "([^"]+)"', iss)
          if not match or match.group(1) != APP_VERSION:
              raise SystemExit(f'Versionskonflikt: config={APP_VERSION!r}, installer={match.group(1) if match else None!r}')
          print('Version konsistent:', APP_VERSION)
          PY
