name: Windows Backup Central Preview Artifact
on: [push]
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/kc-backup-central-security-foundation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build preview
        shell: pwsh
        run: |
          if (Test-Path 'PC_Backup_Vault.spec') { pyinstaller --noconfirm --clean PC_Backup_Vault.spec }
          elseif (Test-Path 'pc_backup_vault.spec') { pyinstaller --noconfirm --clean pc_backup_vault.spec }
          else { pyinstaller --noconfirm --clean --windowed --name PC_Backup_Vault_PREVIEW app.py }
          New-Item -ItemType Directory -Force -Path preview | Out-Null
          Copy-Item dist\* preview -Recurse -Force
          Set-Content preview\PREVIEW_BUILD.txt "PREVIEW ONLY - commit $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Backup-Vault-Backup-Central-PREVIEW
          path: preview/
          retention-days: 7
