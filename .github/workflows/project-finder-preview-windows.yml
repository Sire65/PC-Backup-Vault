name: Project Finder Windows Inventory

on:
  push:
    branches:
      - feature/project-finder-safe-cleanup
      - feature/project-finder-productive-inventory
    paths:
      - 'project_finder/**'
      - 'PROJECT_FINDER_VORSCHAU.py'
      - '.github/workflows/project-finder-preview-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-inventory:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Project Finder
        run: python -m compileall -q project_finder

      - name: Run Project Finder unit tests
        run: python -m unittest discover -s project_finder/tests -p 'test_*.py' -v

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build Windows inventory runner
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name PC-Backup-Vault-Inventur
          PROJECT_FINDER_VORSCHAU.py

      - name: Add safety and usage notice
        shell: pwsh
        run: |
          @'
          PC Backup Vault - Produktive Inventur
          =====================================
          Start: PC-Backup-Vault-Inventur.exe

          Der Scan ist read-only und inventarisiert Dateien einschließlich SHA-256 bis 64 MB.
          Ergebnisse unterscheiden: Zu Git, Git prüfen, lokal behalten, prüfen und Quarantäne-Kandidat.
          Nur bit-identische SHA-256-Dubletten dürfen nach ausdrücklicher Freigabe in Quarantäne verschoben werden.
          Es erfolgt keine automatische endgültige Löschung und keine automatische Git-Veröffentlichung.
          Bestehende Backup-/B2-Funktionen werden durch diesen isolierten Runner nicht verändert.
          '@ | Set-Content -Encoding UTF8 'dist/PC-Backup-Vault-Inventur/LESE_MICH.txt'

      - name: Upload Windows inventory runner
        uses: actions/upload-artifact@v4
        with:
          name: PC-Backup-Vault-Inventur-Windows
          path: dist/PC-Backup-Vault-Inventur/
          if-no-files-found: error
          retention-days: 14
