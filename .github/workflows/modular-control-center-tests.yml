name: Modular Control Center Tests

on:
  push:
    branches:
      - feature/modular-control-center
    paths:
      - 'app.py'
      - 'control_center.py'
      - 'framework_core_adapters.py'
      - 'nas_recovery/**'
      - 'tests/test_control_center_architecture.py'
      - 'tests/test_nas_recovery_safety.py'
      - '.github/workflows/modular-control-center-tests.yml'
  workflow_dispatch:

jobs:
  control-center:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Compile integration
        shell: pwsh
        run: python -m py_compile app.py control_center.py framework_core_adapters.py nas_recovery/__init__.py nas_recovery/safety.py nas_recovery/service.py nas_recovery/ui.py
      - name: Architecture tests
        shell: pwsh
        run: python -m unittest tests.test_control_center_architecture -v
      - name: NAS recovery safety tests
        shell: pwsh
        run: python -m unittest tests.test_nas_recovery_safety -v
      - name: Existing cloud-cost tests
        shell: pwsh
        run: python -m unittest tests.test_cloud_failback -v
      - name: Safety markers
        shell: pwsh
        run: |
          $cc = Get-Content control_center.py -Raw
          $fa = Get-Content framework_core_adapters.py -Raw
          $safe = Get-Content nas_recovery/safety.py -Raw
          $svc = Get-Content nas_recovery/service.py -Raw
          if ($cc -notmatch 'NAS Migration Studio v5.6') { throw 'NAS integration marker missing' }
          if ($fa -notmatch 'adapters, not replacement cores') { throw 'Framework governance marker missing' }
          if ($fa -notmatch 'Escape affects only the topmost closable context') { throw 'WindowCore Escape rule missing' }
          if ($safe -notmatch 'mdadm --assemble --force') { throw 'RAID force-assemble guard missing' }
          if ($safe -notmatch 'set-disk -isreadonly \$false') { throw 'read-only removal guard missing' }
          if ($svc -notmatch 'open\(source, "rb"') { throw 'physical source must be opened read-only' }
