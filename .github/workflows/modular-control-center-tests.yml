name: Modular Control Center Tests

on:
  push:
    branches:
      - feature/modular-control-center
    paths:
      - 'app.py'
      - 'control_center.py'
      - 'framework_core_adapters.py'
      - 'requirements.txt'
      - 'nas_recovery/**'
      - 'project_finder/**'
      - 'tests/test_control_center_architecture.py'
      - 'tests/test_nas_recovery_safety.py'
      - 'tests/test_nas_raid_analysis.py'
      - 'tests/test_nas_ui_state.py'
      - 'tests/test_nas_network.py'
      - 'tests/test_missing_disk_detector.py'
      - 'tests/test_nas_ssh_readonly.py'
      - 'tests/test_nas_ssh_legacy_probe.py'
      - 'tests/test_nas_inventory.py'
      - 'tests/test_nas_recovery_plan.py'
      - 'tests/test_nas_image_verification.py'
      - 'tests/test_recovery_sprint_bundle.py'
      - '.github/workflows/modular-control-center-tests.yml'
  workflow_dispatch:

jobs:
  control-center:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Compile integration
        shell: pwsh
        run: |
          python -m py_compile app.py control_center.py framework_core_adapters.py
          Get-ChildItem nas_recovery -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }
      - name: Architecture tests
        shell: pwsh
        run: python -m unittest tests.test_control_center_architecture -v
      - name: NAS recovery safety tests
        shell: pwsh
        run: python -m unittest tests.test_nas_recovery_safety -v
      - name: RAID image analysis tests
        shell: pwsh
        run: python -m unittest tests.test_nas_raid_analysis -v
      - name: NAS logical UI state tests
        shell: pwsh
        run: python -m unittest tests.test_nas_ui_state -v
      - name: NAS network diagnostics tests
        shell: pwsh
        run: python -m unittest tests.test_nas_network -v
      - name: Missing disk detector tests
        shell: pwsh
        run: python -m unittest tests.test_missing_disk_detector -v
      - name: SSH read-only safety tests
        shell: pwsh
        run: python -m unittest tests.test_nas_ssh_readonly -v
      - name: SSH legacy probe tests
        shell: pwsh
        run: python -m unittest tests.test_nas_ssh_legacy_probe -v
      - name: NAS storage inventory tests
        shell: pwsh
        run: python -m unittest tests.test_nas_inventory -v
      - name: Recovery workflow gate tests
        shell: pwsh
        run: python -m unittest tests.test_nas_recovery_plan -v
      - name: Image verification tests
        shell: pwsh
        run: python -m unittest tests.test_nas_image_verification -v
      - name: Five-sprint recovery bundle tests
        shell: pwsh
        run: python -m unittest tests.test_recovery_sprint_bundle -v
      - name: Existing cloud-cost tests
        shell: pwsh
        run: python -m unittest tests.test_cloud_failback -v
      - name: Safety markers
        shell: pwsh
        run: |
          $cc = Get-Content control_center.py -Raw
          $fa = Get-Content framework_core_adapters.py -Raw
          $safe = Get-Content nas_recovery/safety.py -Raw
          $svc = Get-Content nas_recovery/service.py -Raw
          $raid = Get-Content nas_recovery/raid_analysis.py -Raw
          $eng = Get-Content nas_recovery/recovery_engines.py -Raw
          $states = Get-Content nas_recovery/ui_state.py -Raw
          $net = Get-Content nas_recovery/network.py -Raw
          $missing = Get-Content nas_recovery/missing_disk.py -Raw
          $ssh = Get-Content nas_recovery/ssh_readonly.py -Raw
          $legacy = Get-Content nas_recovery/ssh_legacy_probe.py -Raw
          $inventory = Get-Content nas_recovery/inventory.py -Raw
          $inventoryUi = Get-Content nas_recovery/inventory_ui_integration.py -Raw
          $plan = Get-Content nas_recovery/recovery_plan.py -Raw
          $verify = Get-Content nas_recovery/image_verification.py -Raw
          $coord = Get-Content nas_recovery/recovery_coordinator.py -Raw
          $virtualRaid = Get-Content nas_recovery/raid_virtual_plan.py -Raw
          $handoff = Get-Content nas_recovery/engine_handoff.py -Raw
          if ($cc -notmatch 'NAS Migration Studio v5.6') { throw 'NAS integration marker missing' }
          if ($fa -notmatch 'adapters.*, not replacement cores') { throw 'Framework governance marker missing' }
          if ($fa -notmatch 'Escape affects only the topmost closable context') { throw 'WindowCore Escape rule missing' }
          if ($safe -notmatch 'mdadm --assemble --force') { throw 'RAID force-assemble guard missing' }
          if ($safe -notmatch 'set-disk -isreadonly \$false') { throw 'read-only removal guard missing' }
          if ($svc -notmatch 'open\(source, "rb"') { throw 'physical source must be opened read-only' }
          if ($raid -notmatch 'PhysicalDrive-Pfade sind in der RAID-Imageanalyse nicht zulässig') { throw 'RAID image physical-drive guard missing' }
          if ($raid -notmatch 'p.open\("rb"\)') { throw 'RAID image inspection must be read-only' }
          if ($eng -match 'PhysicalDrive') { throw 'Recovery engine adapter must not pass physical drives' }
          if ($states -notmatch 'unavailable actions are not') { throw 'disabled-action governance marker missing' }
          if ($net -match 'subprocess|powershell|os.system') { throw 'network diagnostics must not execute configuration commands' }
          if ($missing -match 'Initialize-Disk|Format-Volume|Set-Disk|Set-Partition|New-Partition|Remove-Partition') { throw 'missing-disk detector contains a mutating storage command' }
          if ($ssh -notmatch 'exact read-only command whitelist') { throw 'SSH whitelist marker missing' }
          if ($ssh -match 'rm -rf|touch /tmp|reboot|shutdown -h|fsck -y|remount,rw') { throw 'SSH service contains a mutating command' }
          if ($legacy -match 'exec_command|client.connect|subprocess|os.system') { throw 'legacy probe must not authenticate or execute commands' }
          if ($legacy -notmatch 'never modifies Paramiko/global crypto policy') { throw 'legacy crypto-policy safety marker missing' }
          if ($inventory -match 'subprocess|paramiko|exec_command|os.system') { throw 'inventory parser must not execute commands or open SSH' }
          if ($inventory -notmatch 'already collected read-only SSH results') { throw 'inventory reuse marker missing' }
          if ($inventoryUi -notmatch 'successful read-only SSH report') { throw 'inventory view gating marker missing' }
          if ($plan -notmatch 'unavailable recovery actions are not executable') { throw 'recovery prerequisite gate missing' }
          if ($verify -notmatch 'Verify a recovery image read-only') { throw 'image verification read-only marker missing' }
          if ($coord -notmatch 'never repairs or writes to an original disk') { throw 'recovery coordinator safety marker missing' }
          if ($virtualRaid -notmatch 'never from PhysicalDrive paths') { throw 'virtual RAID image-only marker missing' }
          if ($handoff -notmatch 'without passing disk/image arguments automatically') { throw 'external engine handoff safety marker missing' }
