name: Vollstaendigen 1.7.3 Quellstand herstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vollstaendigen Quellstand aus Bootstrap herstellen
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".bootstrap/part*" -ErrorAction SilentlyContinue | Sort-Object Name
          if (-not $parts) {
            Write-Host "Bootstrap bereits entfernt; nichts zu tun."
            exit 0
          }
          $out = [System.IO.File]::Open("source.zip", [System.IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $raw = Get-Content $part.FullName -Raw
              $clean = $raw -replace '[^A-Za-z0-9+/=]', ''
              $clean = $clean.TrimEnd('=')
              while (($clean.Length % 4) -ne 0) { $clean += '=' }
              $bytes = [Convert]::FromBase64String($clean)
              $out.Write($bytes, 0, $bytes.Length)
              Write-Host "$($part.Name): $($bytes.Length) Bytes decodiert"
            }
          }
          finally {
            $out.Dispose()
          }
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "source.zip SHA256=$hash"
          if ($hash -ne "caf5191fd41d7d52a6eaa880e7ed73a94d2f5ad0d9c8f023e36d136bdc665eba") {
            throw "Quellpaket-Hash stimmt nicht mit dem freigegebenen 1.7.3-Referenzpaket ueberein."
          }
          New-Item -ItemType Directory -Force -Path "_source" | Out-Null
          Expand-Archive -Path "source.zip" -DestinationPath "_source" -Force
          $count = (Get-ChildItem "_source" -File -Recurse).Count
          Write-Host "Extrahierte Dateien: $count"
          if ($count -ne 60) { throw "Quellpaket unvollstaendig: erwartet 60, gefunden $count Dateien" }
          Get-ChildItem "_source" -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination "." -Recurse -Force
          }
          Remove-Item "source.zip" -Force
          Remove-Item "_source" -Recurse -Force
          Remove-Item ".bootstrap" -Recurse -Force
          Remove-Item ".fix" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ".upload_marker" -Force -ErrorAction SilentlyContinue

      - name: Quellstand committen
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "Keine Aenderungen."
            exit 0
          }
          git commit -m "Materialize complete PC Backup Vault 1.7.3 source"
          git push
